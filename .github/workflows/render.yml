name: Render icons
 
on:
  repository_dispatch:
    types: [render-icons, prune-icons]
  workflow_dispatch:
    inputs:
      jobs:
        description: 'JSON array, e.g. [{"form":"robot","icon":24,"col1":98,"col2":83,"glow":true}]'
        required: true
 
permissions:
  contents: write
 
jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'render-icons'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so file ages are available for pruning
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Install dependencies
        working-directory: render
        run: |
          npm install
          npx playwright install --with-deps chromium
 
      - name: Serve the site locally
        run: |
          python3 -m http.server 8080 &
          sleep 2
 
      - name: Render GIFs
        working-directory: render
        env:
          JOBS: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload.jobs) || github.event.inputs.jobs }}
          OUT_DIR: ${{ github.workspace }}/renders
        run: node capture.mjs
 
      - name: Prune old renders
        if: always()
        env:
          KEEP_DAYS: "2"
        run: |
          cutoff=$(date -d "$KEEP_DAYS days ago" +%s)
          for f in renders/*.gif; do
            [ -e "$f" ] || continue
            ts=$(git log -1 --format=%ct -- "$f")
            if [ -n "$ts" ] && [ "$ts" -lt "$cutoff" ]; then git rm -q "$f"; fi
          done
 
      - name: Commit renders
        if: always()
        run: |
          git config user.name "gd-icon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add renders || true
          git diff --cached --quiet && exit 0
          git commit -m "Update renders"
          # Several runs can overlap now, so retry the push if another run got there first
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 6 + 2))
          done
          exit 1
 
  # Deletes GIFs the sheet has already copied into itself
  prune:
    if: github.event.action == 'prune-icons'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
 
      - name: Delete requested renders
        env:
          FILES: ${{ toJson(github.event.client_payload.files) }}
        run: |
          echo "$FILES" | jq -r '.[]' | while read -r name; do
            if [[ "$name" =~ ^[a-z]+-[0-9]+-[0-9]+-[0-9]+-[01]-t\.gif$ ]] && [ -f "renders/$name" ]; then
              git rm -q "renders/$name"
            fi
          done
 
      - name: Commit deletions
        run: |
          git config user.name "gd-icon-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Remove placed renders"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 6 + 2))
          done
          exit 1
 
