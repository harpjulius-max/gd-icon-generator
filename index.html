<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GD Icon Render</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    width: 300px; 
    height: 300px; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
  }
  #iconWrap { 
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bob 1.6s ease-in-out infinite; 
  }
  #iconWrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  @keyframes bob { 
    0% { transform: translateY(0px); } 
    50% { transform: translateY(-15px); } 
    100% { transform: translateY(0px); } 
  }
</style>
</head>
<body>
<div id="iconWrap"></div>

<script>
async function main(){
  const params = new URLSearchParams(window.location.search);
  const type = (params.get("form") || "cube").toLowerCase();
  const id = parseInt(params.get("icon")) || 1;
  const col1 = parseInt(params.get("col1")) || 1;
  const col2 = parseInt(params.get("col2")) || 3;
  const glowOn = params.get("glow") === "true";

  const wrap = document.getElementById("iconWrap");

  // Render all icons directly from GDBrowser's server assembler
  const img = document.createElement("img");
  img.src = `https://gdbrowser.com/icon/icon?form=${type}&icon=${id}&col1=${col1}&col2=${col2}&glow=${glowOn ? 1 : 0}`;
  
  img.onerror = () => {
    // Fallback if GDBrowser API fails
    console.error("Failed to load icon from server.");
  };

  wrap.appendChild(img);
}

main();
</script>
</body>
</html>
