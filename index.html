<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GD Icon Render</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    width: 300px; 
    height: 300px; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
  }
  #iconWrap { 
    animation: bob 1.6s ease-in-out infinite; 
  }
  @keyframes bob { 
    0% { transform: translateY(0px); } 
    50% { transform: translateY(-15px); } 
    100% { transform: translateY(0px); } 
  }
</style>
</head>
<body>

<div id="iconWrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
<script>
async function main() {
  const params = new URLSearchParams(window.location.search);
  const type = params.get("form") || "cube";
  const id = params.get("icon") || "1";
  const col1 = params.get("col1") || "0";
  const col2 = params.get("col2") || "0";
  const glowOn = params.get("glow") === "true";

  // 1. Fetch built-in GD Color palette from GDBrowser API
  let colorMap = {};
  try {
    const res = await fetch("https://gdbrowser.com/api/iconkit");
    const data = await res.json();
    colorMap = data.colors || {};
  } catch (e) {
    console.warn("Could not load color palette from API, using fallback.");
  }

  // Convert GD Color ID to Hex string
  function getColorHex(colID) {
    const c = colorMap[colID];
    if (c) {
      return "#" + ((1 << 24) + (c.r << 16) + (c.g << 8) + c.b).toString(16).slice(1);
    }
    // Default GD colors fallback map if API fails
    const defaults = {
      "0": "#7d7d7d", "1": "#ff0000", "2": "#ff5a00", "3": "#ffb400",
      "83": "#00ffff", "98": "#ff0055"
    };
    return defaults[colID] || "#ffffff";
  }

  const primaryColor = getColorHex(col1);
  const secondaryColor = getColorHex(col2);

  // 2. Load pre-rendered base icon directly with explicit color arguments
  const iconUrl = `https://gdbrowser.com/icon/icon?form=${type}&icon=${id}&col1=${col1}&col2=${col2}&glow=${glowOn}`;

  const app = new PIXI.Application({
    width: 150,
    height: 150,
    backgroundAlpha: 0
  });
  document.getElementById("iconWrap").appendChild(app.view);

  // Create texture from image
  const texture = await PIXI.Assets.load(iconUrl);
  const sprite = new PIXI.Sprite(texture);
  
  sprite.anchor.set(0.5);
  sprite.x = 75;
  sprite.y = 75;

  app.stage.addChild(sprite);
}

main();
</script>
</body>
</html>
