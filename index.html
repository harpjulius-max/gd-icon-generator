<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GD Icon Render</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 300px;
      height: 300px;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #iconWrap {
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>
  <div id="iconWrap"></div>

  <script type="module">
    import * as PIXI from "https://esm.sh/pixi.js@8";
    import { renderIcon } from "https://esm.sh/gavatar@latest";
  
    const params = new URLSearchParams(window.location.search);
    const form = params.get("form") || "cube";
    const iconID = parseInt(params.get("icon"));
    const col1 = parseInt(params.get("col1"));
    const col2 = parseInt(params.get("col2"));
    const glow = params.get("glow") === "true";
  
    async function main() {
      const canvas = await renderIcon(PIXI, { form, iconID, col1, col2, glow });
      canvas.style.width = "150px";
      canvas.style.height = "150px";
      document.getElementById("iconWrap").appendChild(canvas);
    }
  
    main();
  </script>
</body>
</html>
