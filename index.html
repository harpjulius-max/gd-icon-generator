<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GD Icon Render</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    width: 300px; 
    height: 300px; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
  }
  #iconWrap { 
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bob 1.6s ease-in-out infinite; 
  }
  #icon {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  @keyframes bob { 
    0% { transform: translateY(0px); } 
    50% { transform: translateY(-15px); } 
    100% { transform: translateY(0px); } 
  }
</style>
</head>
<body>

<div id="iconWrap">
  <img id="icon" alt="GD Icon" />
</div>

<script>
async function main() {
  const params = new URLSearchParams(window.location.search);
  const username = params.get("username");
  const type = params.get("form") || "cube";
  const id = params.get("icon") || "1";
  const col1 = params.get("col1") || "0";
  const col2 = params.get("col2") || "0";
  const glowOn = params.get("glow") === "true";

  const imgEl = document.getElementById("icon");

  let targetUrl;
  if (username) {
    targetUrl = `https://gdbrowser.com/icon/${encodeURIComponent(username)}`;
  } else {
    targetUrl = `https://gdbrowser.com/icon/icon?form=${type}&icon=${id}&col1=${col1}&col2=${col2}&glow=${glowOn}`;
  }

  // Pre-fetch trigger to ask GDBrowser to render & cache the icon server-side
  try {
    await fetch(targetUrl, { mode: 'no-cors' });
  } catch (e) {
    // Ignore fetch restrictions; server receives trigger request
  }

  // Set image source
  imgEl.src = targetUrl;
}

main();
</script>
</body>
</html>
