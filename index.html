<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GD Icon Render</title>
<style>
  html, body { margin:0; padding:0; width:300px; height:300px; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #iconWrap { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%{transform:translateY(0px);} 50%{transform:translateY(-15px);} 100%{transform:translateY(0px);} }
</style>
</head>
<body>
<div id="iconWrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.0.0/pixi.min.js"></script>
<script>
// ---------- constants ----------
const WHITE = 0xffffff;
const formMap = { cube:"player", ball:"player_ball", ufo:"bird", wave:"dart", ship:"ship", swing:"swing", jetpack:"jetpack", robot:"robot", spider:"spider" };
const COMPLEX_FORMS = ["robot", "spider"];
const BASE = "https://gdbrowser.com/iconkit/icons/";
 
// Tuning values, overridable from the URL (e.g. &scale=3&rotmode=6&dome=1)
const Q = new URLSearchParams(window.location.search);
const num = (k, d) => Q.has(k) ? parseFloat(Q.get(k)) : d;
const SHEET_SCALE = num("scale", 4);   // robot/spider part spacing
const ROTATE_MODE = num("rotmode", 2); // how rotated sheet frames are un-rotated; try 6
const ROT_SIGN    = num("rotsign", 1); // -1 if robot/spider limbs bend the wrong way
const ANGLE       = num("angle", 0);   // whole-icon rotation (should stay 0 now)
const SHOW_DOME   = Q.get("dome") === "1"; // draw the _3_001 layer (ship/ufo glass)
const CANVAS      = num("canvas", 270);    // canvas size in px (page is 300 tall, bob moves up 15)
const PAD         = num("pad", 6);         // keep-clear margin so nothing touches the edge
const ZOOM        = num("zoom", 1);        // optional manual size multiplier
const BGP = Q.get("bg") || "";   // &bg=ffffff for a color, &bg=transparent for none
if (BGP === "transparent" || /^[0-9a-fA-F]{6}$/.test(BGP)) {
  document.documentElement.style.background = document.body.style.background = BGP === "transparent" ? "transparent" : "#" + BGP;
}
 
// ---------- helpers ----------
function padZero(num){ num = +num; return num < 10 ? "0"+num : ""+num; }
function parseWeirdArray(data){ return data.replace(/[^0-9,-.]/g,"").split(",").map(x=>+x); }
 
function parsePlist(xmlText){
  let dom = new DOMParser().parseFromString(xmlText, "text/xml");
  let frames = dom.children[0].children[0].children[1].children;
  let pos = {};
  for (let i=0;i<frames.length;i+=2){
    let name = frames[i].innerHTML;
    let data = frames[i+1].children;
    let rotated = false;
    pos[name] = {};
    for (let n=0;n<data.length;n+=2){
      let key = data[n].innerHTML;
      let val = data[n+1].innerHTML;
      if (key === "spriteOffset") pos[name].spriteOffset = parseWeirdArray(val);
      if (key === "textureRotated") rotated = data[n+1].outerHTML.includes("true");
      if (key === "textureRect"){
        let arr = val.slice(1,-1).split("},{").map(x=>parseWeirdArray(x));
        pos[name].pos = arr[0];
        pos[name].size = arr[1];
      }
    }
    pos[name].rotated = rotated;
    pos[name].dispSize = [...pos[name].size]; // upright (on-screen) size
    if (rotated) pos[name].size.reverse();    // size of the region as stored on the sheet
  }
  return pos;
}
 
// One sprite for any frame. Each frame's own textureRotated flag decides
// whether it needs un-rotating, so no per-icon angle hacks are needed.
function makeSprite(texture, b, tint){
  const frame = new PIXI.Rectangle(b.pos[0], b.pos[1], b.size[0], b.size[1]);
  const orig  = new PIXI.Rectangle(0, 0, b.dispSize[0], b.dispSize[1]);
  const tex = new PIXI.Texture({ source: texture.source, frame, orig, rotate: b.rotated ? ROTATE_MODE : 0 });
  const s = new PIXI.Sprite(tex);
  s.tint = tint;
  s.anchor.set(0.5);
  s.x = b.spriteOffset ? b.spriteOffset[0] : 0;
  s.y = -(b.spriteOffset ? b.spriteOffset[1] : 0);
  return s;
}
 
// Which sheet image (01-04) a named robot/spider part uses.
function partFileNum(name){
  const n = (name || "").toLowerCase();
  if (n.includes("head")) return 1;
  if (n.includes("leg")) return 2;
  if (n.includes("connector")) return 3;
  if (n.includes("foot")) return 4;
  return 1;
}
 
// Darken a color (amt 0-255) for back parts
function shade(color, amt){
  const k = amt / 255;
  const r = ((color >> 16) & 255) * k, g = ((color >> 8) & 255) * k, b = (color & 255) * k;
  return (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b);
}
 
// ---------- main ----------
async function main(){
  const type = Q.get("form") || "cube";
  const id = parseInt(Q.get("icon"));
  const col1 = parseInt(Q.get("col1"));
  const col2 = parseInt(Q.get("col2"));
  const glowOn = Q.get("glow") === "true";
 
  const apiRes = await fetch("https://gdbrowser.com/api/iconkit");
  const apiData = await apiRes.json();
  const colors = apiData.colors;
  function toHex(colID){
    let c = colors[colID];
    return c ? (c.r<<16)+(c.g<<8)+c.b : WHITE;
  }
 
  const form = formMap[type.toLowerCase()] || type.toLowerCase();
  const iconStr = `${form}_${padZero(id)}`;
 
  const app = new PIXI.Application();
  await app.init({ width:CANVAS, height:CANVAS, backgroundAlpha:0 });
  document.getElementById("iconWrap").appendChild(app.canvas);
 
  const container = new PIXI.Container();
 
  const plistRes = await fetch(`${BASE}${iconStr}-uhd.plist`);
  const framePos = parsePlist(await plistRes.text());
  const texture = await PIXI.Assets.load(`${BASE}${iconStr}-uhd.png`);
  console.log("frames:", Object.entries(framePos).map(([k,v]) => k + (v.rotated ? " (rotated)" : "")).join(", "));
 
  // Layers for one part, back to front. Glow is returned separately.
  function layersFor(base, tintAmt){
    const out = { glow: [], body: [] };
    const add = (list, suffix, color) => {
      const b = framePos[base + suffix];
      if (b && color !== null) list.push(makeSprite(texture, b, color));
    };
    add(out.glow, "_glow_001.png", glowOn ? toHex(col2) : null);
    add(out.body, "_3_001.png",     SHOW_DOME ? WHITE : null);
    add(out.body, "_2_001.png",     shade(toHex(col2), tintAmt));
    add(out.body, "_001.png",       shade(toHex(col1), tintAmt));
    add(out.body, "_extra_001.png", WHITE); // eyes / small details, never tinted
    return out;
  }
 
  const glowLayer = new PIXI.Container();
  const bodyLayer = new PIXI.Container();
 
  if (COMPLEX_FORMS.includes(form)){
    const robotData = apiData.robotAnimations;
    const info = robotData.info[form];
    const animSet = robotData.animations[form];
    const poseFrame = animSet[animSet.idle ? "idle" : "run"].frames[0];
    console.log("first part data:", JSON.stringify(poseFrame[0]), "count:", poseFrame.length);
 
    poseFrame.forEach((partData, i) => {
      const base = `${iconStr}_${padZero(partFileNum(info.names[i]))}`;
      const tintAmt = info.tints && info.tints[i] ? info.tints[i] : 255;
      const layers = layersFor(base, tintAmt);
 
      const place = () => {
        const c = new PIXI.Container();
        c.x = partData.pos[0] * SHEET_SCALE;
        c.y = -partData.pos[1] * SHEET_SCALE;
        c.scale.x = partData.scale[0] * (partData.flipped[0] ? -1 : 1);
        c.scale.y = partData.scale[1] * (partData.flipped[1] ? -1 : 1);
        c.angle = ROT_SIGN * partData.rotation;
        return c;
      };
      const g = place(), b = place();
      layers.glow.forEach(s => g.addChild(s));
      layers.body.forEach(s => b.addChild(s));
      glowLayer.addChild(g);
      bodyLayer.addChild(b);
    });
  } else {
    const layers = layersFor(iconStr, 255);
    layers.glow.forEach(s => glowLayer.addChild(s));
    layers.body.forEach(s => bodyLayer.addChild(s));
  }
 
  container.addChild(glowLayer, bodyLayer);
  container.x = CANVAS / 2; container.y = CANVAS / 2;
  container.angle = ANGLE;
 
  // Auto-fit: only ever shrinks, so relative sizes between forms stay consistent,
  // but nothing can overflow the canvas.
  const lb = container.getLocalBounds();
  const reach = Math.max(Math.abs(lb.minX), Math.abs(lb.maxX), Math.abs(lb.minY), Math.abs(lb.maxY));
  const fit = reach > 0 ? Math.min(1, (CANVAS / 2 - PAD) / reach) : 1;
  container.scale.set(fit * ZOOM);
  console.log("fit scale:", fit, "reach:", reach);
  app.stage.addChild(container);
  window.__ready = true; // lets the GIF renderer know drawing is finished
}
 
main().catch(e => { console.error(e); window.__ready = "error"; });
</script>
</body>
</html>
