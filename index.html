<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GD Icon Render</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    width: 300px; 
    height: 300px; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
  }
  #icon { 
    width: 150px;
    height: 150px;
    object-fit: contain;
    animation: bob 1.6s ease-in-out infinite; 
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #icon.loaded {
    opacity: 1;
  }
  @keyframes bob { 
    0% { transform: translateY(0px); } 
    50% { transform: translateY(-15px); } 
    100% { transform: translateY(0px); } 
  }
</style>
</head>
<body>

<img id="icon" alt="GD Icon" />

<script>
async function main() {
  const params = new URLSearchParams(window.location.search);
  const username = params.get("username");
  const type = params.get("form") || "cube";
  const id = params.get("icon") || "1";
  const col1 = params.get("col1") || "0";
  const col2 = params.get("col2") || "0";
  const glowOn = params.get("glow") === "true";

  const imgEl = document.getElementById("icon");

  // Determine the target GDBrowser endpoint
  let targetUrl;
  if (username) {
    targetUrl = `https://gdbrowser.com/icon/${encodeURIComponent(username)}`;
  } else {
    targetUrl = `https://gdbrowser.com/icon/icon?form=${type}&icon=${id}&col1=${col1}&col2=${col2}&glow=${glowOn}`;
  }

  // Handle load state
  imgEl.onload = () => imgEl.classList.add("loaded");

  // Force-trigger generation on GDBrowser by pre-fetching via image mode 'no-cors'
  try {
    await fetch(targetUrl, { mode: 'no-cors' });
  } catch (e) {
    // Ignore fetch restrictions, server receives the trigger request
  }

  // Assign image source to display rendered icon
  imgEl.src = targetUrl;
}

main();
</script>
</body>
</html>
