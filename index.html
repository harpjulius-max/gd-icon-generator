<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GD Icon Render</title>
<style>
  html, body { margin:0; padding:0; width:300px; height:300px; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #iconWrap { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%{transform:translateY(0px);} 50%{transform:translateY(-15px);} 100%{transform:translateY(0px);} }
</style>
</head>
<body>
<div id="iconWrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.0.0/pixi.min.js"></script>
<script>
const WHITE = 0xffffff;
const formMap = { cube:"player", ball:"player_ball", ufo:"bird", wave:"dart", ship:"ship", swing:"swing", jetpack:"jetpack", robot:"robot", spider:"spider" };
const COMPLEX_FORMS = ["robot", "spider"];

function padZero(num){ num = +num; return num < 10 ? "0"+num : ""+num; }
function parseWeirdArray(data){ return data.replace(/[^0-9,-.]/g,"").split(",").map(x=>+x); }

function parsePlist(xmlText){
  let dom = new DOMParser().parseFromString(xmlText, "text/xml");
  let frames = dom.children[0].children[0].children[1].children;
  let pos = {};
  for (let i=0;i<frames.length;i+=2){
    let name = frames[i].innerHTML;
    let data = frames[i+1].children;
    let rotated = false;
    pos[name] = {};
    for (let n=0;n<data.length;n+=2){
      let key = data[n].innerHTML;
      let val = data[n+1].innerHTML;
      if (key === "spriteOffset") pos[name].spriteOffset = parseWeirdArray(val);
      if (key === "textureRotated") rotated = data[n+1].outerHTML.includes("true");
      if (key === "textureRect"){
        let arr = val.slice(1,-1).split("},{").map(x=>parseWeirdArray(x));
        pos[name].pos = arr[0];
        pos[name].size = arr[1];
      }
    }
    if (rotated) pos[name].size.reverse();
  }
  return pos;
}

function makePartSprite(texture, bounds, tint){
  const rect = new PIXI.Rectangle(bounds.pos[0], bounds.pos[1], bounds.size[0], bounds.size[1]);
  const partTexture = new PIXI.Texture({ source: texture.source, frame: rect });
  const sprite = new PIXI.Sprite(partTexture);
  sprite.tint = tint;
  sprite.anchor.set(0.5);
  sprite.x = (bounds.spriteOffset ? bounds.spriteOffset[0] : 0);
  sprite.y = -(bounds.spriteOffset ? bounds.spriteOffset[1] : 0);
  return sprite;
}

async function main(){
  const params = new URLSearchParams(window.location.search);
  const type = params.get("form") || "cube";
  const id = parseInt(params.get("icon"));
  const col1 = parseInt(params.get("col1"));
  const col2 = parseInt(params.get("col2"));
  const glowOn = params.get("glow") === "true";

  const apiRes = await fetch("https://gdbrowser.com/api/iconkit");
  const apiData = await apiRes.json();
  const colors = apiData.colors;
  function toHex(colID){
    let c = colors[colID];
    return c ? (c.r<<16)+(c.g<<8)+c.b : WHITE;
  }

  const form = formMap[type.toLowerCase()] || type.toLowerCase();
  const iconStr = `${form}_${padZero(id)}`;

  const app = new PIXI.Application();
  await app.init({ width:150, height:150, backgroundAlpha:0 });
  document.getElementById("iconWrap").appendChild(app.canvas);

  const container = new PIXI.Container();

  if (COMPLEX_FORMS.includes(form)){
  const robotData = apiData.robotAnimations;
  const animSet = robotData.animations[form];
  const animName = animSet.idle ? "idle" : "run";
  const poseFrame = animSet[animName].frames[0];

  for (const partData of poseFrame){
    const partNum = partData.part;
    const partIconStr = `${iconStr}_${partNum}`;

    const plistRes = await fetch(`https://gdbrowser.com/iconkit/icons/${partIconStr}-uhd.plist`);
    if (!plistRes.ok) continue;
    const framePos = parsePlist(await plistRes.text());
    const texture = await PIXI.Assets.load(`https://gdbrowser.com/iconkit/icons/${partIconStr}-uhd.png`);

    [
      { suffix: "_001.png", color: toHex(col1) },
      { suffix: "_2_001.png", color: toHex(col2) }
    ].forEach(layer => {
      const frameName = partIconStr + layer.suffix;
      const bounds = framePos[frameName];
      if (!bounds) return;
      const sprite = makePartSprite(texture, bounds, layer.color);
      sprite.x += partData.pos[0];
      sprite.y -= partData.pos[1];
      sprite.scale.x = partData.scale[0] * (partData.flipped[0] ? -1 : 1);
      sprite.scale.y = partData.scale[1] * (partData.flipped[1] ? -1 : 1);
      sprite.angle = -partData.rotation;
      container.addChild(sprite);
    });
  }
} else {
    // Simple single-layer forms
    const plistRes = await fetch(`https://gdbrowser.com/iconkit/icons/${iconStr}-uhd.plist`);
    const framePos = parsePlist(await plistRes.text());
    const texture = await PIXI.Assets.load(`https://gdbrowser.com/iconkit/icons/${iconStr}-uhd.png`);

    [
      { suffix: "_glow_001.png", color: glowOn ? toHex(col2) : null },
      { suffix: "_2_001.png", color: toHex(col2) },
      { suffix: "_001.png", color: toHex(col1) }
    ].forEach(layer => {
      if (layer.color === null) return;
      const frameName = iconStr + layer.suffix;
      const bounds = framePos[frameName];
      if (!bounds) return;
      container.addChild(makePartSprite(texture, bounds, layer.color));
    });
  }

  container.x = 75; container.y = 75;
  container.angle = -90;
  app.stage.addChild(container);
}

main();
</script>
</body>
</html>
