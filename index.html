<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GD Icon Render</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    width: 300px; 
    height: 300px; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
  }
  #icon { 
    width: 150px;
    height: 150px;
    object-fit: contain;
    animation: bob 1.6s ease-in-out infinite; 
  }
  @keyframes bob { 
    0% { transform: translateY(0px); } 
    50% { transform: translateY(-15px); } 
    100% { transform: translateY(0px); } 
  }
</style>
</head>
<body>

<img id="icon" alt="GD Icon" />

<script>
function main(){
  const params = new URLSearchParams(window.location.search);
  const type = params.get("form") || "cube";
  const id = params.get("icon") || "1";
  const col1 = params.get("col1") || "0";
  const col2 = params.get("col2") || "0";
  const glowOn = params.get("glow") === "true";

  // Build the GDBrowser direct image URL
  const gdbrowserUrl = `https://gdbrowser.com/icon/icon?form=${type}&icon=${id}&col1=${col1}&col2=${col2}&glow=${glowOn}`;

  // Set the image src directly
  document.getElementById("icon").src = gdbrowserUrl;
}

main();
</script>
</body>
</html>
