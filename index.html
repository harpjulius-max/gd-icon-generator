<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GD Icon Render</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    width: 300px; 
    height: 300px; 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    overflow: hidden; 
  }
  #iconWrap { 
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bob 1.6s ease-in-out infinite; 
  }
  #iconWrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  @keyframes bob { 
    0% { transform: translateY(0px); } 
    50% { transform: translateY(-15px); } 
    100% { transform: translateY(0px); } 
  }
</style>
</head>
<body>
<div id="iconWrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.0.0/pixi.min.js"></script>
<script>
const WHITE = 0xffffff;
const formMap = { 
  cube: "player", 
  ball: "player_ball", 
  ufo: "bird", 
  wave: "dart", 
  ship: "ship", 
  swing: "swing", 
  jetpack: "jetpack", 
  robot: "robot", 
  spider: "spider" 
};
const COMPLEX_FORMS = ["robot", "spider"];

function padZero(num){ num = +num; return num < 10 ? "0" + num : "" + num; }
function parseWeirdArray(data){ return data.replace(/[^0-9,-.]/g, "").split(",").map(x => +x); }

function parsePlist(xmlText){
  let dom = new DOMParser().parseFromString(xmlText, "text/xml");
  let frames = dom.children[0].children[0].children[1].children;
  let pos = {};
  for (let i = 0; i < frames.length; i += 2){
    let name = frames[i].innerHTML;
    let data = frames[i+1].children;
    let rotated = false;
    pos[name] = {};
    for (let n = 0; n < data.length; n += 2){
      let key = data[n].innerHTML;
      let val = data[n+1].innerHTML;
      if (key === "spriteOffset") pos[name].spriteOffset = parseWeirdArray(val);
      if (key === "textureRotated") rotated = data[n+1].outerHTML.includes("true");
      if (key === "textureRect"){
        let arr = val.slice(1, -1).split("},{").map(x => parseWeirdArray(x));
        pos[name].pos = arr[0];
        pos[name].size = arr[1];
      }
    }
    if (rotated) pos[name].size.reverse();
  }
  return pos;
}

function makePartSprite(texture, bounds, tint){
  const rect = new PIXI.Rectangle(bounds.pos[0], bounds.pos[1], bounds.size[0], bounds.size[1]);
  const partTexture = new PIXI.Texture({ source: texture.source, frame: rect });
  const sprite = new PIXI.Sprite(partTexture);
  sprite.tint = tint;
  sprite.anchor.set(0.5);
  if (bounds.spriteOffset) {
    sprite.x = bounds.spriteOffset[0];
    sprite.y = -bounds.spriteOffset[1];
  }
  return sprite;
}

async function main(){
  const params = new URLSearchParams(window.location.search);
  const type = (params.get("form") || "cube").toLowerCase();
  const id = parseInt(params.get("icon")) || 1;
  const col1 = parseInt(params.get("col1")) || 1;
  const col2 = parseInt(params.get("col2")) || 3;
  const glowOn = params.get("glow") === "true";

  const wrap = document.getElementById("iconWrap");

  // Fetch color database for both client-side and server-rendered paths
  const apiRes = await fetch("https://gdbrowser.com/api/iconkit");
  const apiData = await apiRes.json();
  const colors = apiData.colors;

  function toHex(colID){
    let c = colors[colID];
    return c ? (c.r << 16) + (c.g << 8) + c.b : WHITE;
  }

  function toHexStr(colID){
    let c = colors[colID];
    if (!c) return "ffffff";
    const r = c.r.toString(16).padStart(2, "0");
    const g = c.g.toString(16).padStart(2, "0");
    const b = c.b.toString(16).padStart(2, "0");
    return `${r}${g}${b}`;
  }

  // Complex forms (Robot / Spider) using hex color strings
  if (COMPLEX_FORMS.includes(type)) {
    const hex1 = toHexStr(col1);
    const hex2 = toHexStr(col2);
    const img = document.createElement("img");
    img.src = `https://gdbrowser.com/icon/icon?form=${type}&icon=${id}&col1=${hex1}&col2=${hex2}&glow=${glowOn ? 1 : 0}`;
    wrap.appendChild(img);
    return;
  }

  // Simple forms rendered via PixiJS
  const baseColor = toHex(col1);
  const secColor = toHex(col2);

  const form = formMap[type] || type;
  const iconStr = `${form}_${padZero(id)}`;

  const app = new PIXI.Application();
  await app.init({ width: 150, height: 150, backgroundAlpha: 0 });
  wrap.appendChild(app.canvas);

  const container = new PIXI.Container();

  const plistRes = await fetch(`https://gdbrowser.com/iconkit/icons/${iconStr}-uhd.plist`);
  const framePos = parsePlist(await plistRes.text());
  const texture = await PIXI.Assets.load(`https://gdbrowser.com/iconkit/icons/${iconStr}-uhd.png`);

  // Target base body layers and driver/thruster attachment layers separately
  const mainLayers = [
    { frame: `${iconStr}_glow_001.png`, color: glowOn ? secColor : null },
    { frame: `${iconStr}_2_001.png`, color: secColor },
    { frame: `${iconStr}_001.png`, color: baseColor },
    { frame: `${iconStr}_extra_001.png`, color: WHITE }
  ];

  // Optional secondary attachment sub-sprites (used in ships/jetpacks)
  const attachLayers = [
    { frame: `${iconStr}_02_glow_001.png`, color: glowOn ? secColor : null },
    { frame: `${iconStr}_02_2_001.png`, color: secColor },
    { frame: `${iconStr}_02_001.png`, color: baseColor },
    { frame: `${iconStr}_02_extra_001.png`, color: WHITE }
  ];

  mainLayers.concat(attachLayers).forEach(layer => {
    if (layer.color === null) return;
    const bounds = framePos[layer.frame];
    if (!bounds) return;
    container.addChild(makePartSprite(texture, bounds, layer.color));
  });

  container.x = 75; 
  container.y = 75;
  container.angle = 0;
  app.stage.addChild(container);
}

main();
</script>
</body>
</html>
